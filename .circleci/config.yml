version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/jobs
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -e .
      - run:
          name: Run tests
          command: pytest -q

workflows:
  version: 2
  test_workflow:
    jobs:
      - test
